# nginx.conf

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy
    # style-src requires 'unsafe-inline' because Vue's v-show directive and :style
    # bindings inject inline style attributes at runtime — this cannot be avoided
    # without replacing core Vue directives.
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self' http://127.0.0.1:8000 http://192.168.1.75:8000 https://telemed-dev.dohsox.com wss://telemed-dev.dohsox.com https://www.google.com;
        object-src 'none';
        base-uri 'self';
        frame-ancestors 'none';
        form-action 'self';
    " always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
